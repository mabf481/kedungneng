name: Clean registration PDF template

on:
  push:
    paths:
      - '.github/workflows/clean-daftar-pdf.yml'

permissions:
  contents: write

jobs:
  clean-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PyMuPDF
        run: python -m pip install pymupdf
      - name: Make PDF template contain no text
        run: |
          python - <<'PY'
          import fitz

          doc = fitz.open("daftar.pdf")

          for page in doc:
              # Remove every text object from the template.
              for block in page.get_text("blocks"):
                  rect = fitz.Rect(block[:4])
                  if not rect.is_empty:
                      page.add_redact_annot(rect, fill=(1, 1, 1))
              page.apply_redactions()

          doc.save("daftar.cleaned.pdf", garbage=4, deflate=True)
          doc.close()

          # Verify that the template contains no extractable text.
          check = fitz.open("daftar.cleaned.pdf")
          remaining = "\n".join(page.get_text() for page in check).strip()
          check.close()
          if remaining:
              raise SystemExit("Template still contains text after cleanup.")
          PY
          mv daftar.cleaned.pdf daftar.pdf
      - name: Commit cleaned template
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daftar.pdf
          git diff --cached --quiet && exit 0
          git commit -m "Make registration PDF template text-free"
          git push
